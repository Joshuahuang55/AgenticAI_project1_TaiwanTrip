[project]
name = "gemini-web-tool-calling"
version = "0.1.0"
description = "Taiwan Like a Local: a travel copilot for foreigners visiting Taiwan (FastAPI + LiteLLM + Gemini + Taiwanese open data)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "openai-agents[litellm]>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
